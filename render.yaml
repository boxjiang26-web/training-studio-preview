services:
  - type: web
    name: training-studio-preview
    runtime: docker
    plan: free
    branch: main
    autoDeployTrigger: commit
    healthCheckPath: /healthz
    envVars:
      - key: PREVIEW_PRIVATE
        value: "1"
      - key: PREVIEW_PASSWORD
        generateValue: true
      - key: DATA_DIR
        value: /tmp/studio
      - key: DATABASE_URL
        fromDatabase:
          name: training-studio-db
          property: connectionString

databases:
  - name: training-studio-db
    databaseName: training_studio
    plan: free
